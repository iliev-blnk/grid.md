[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcina"
version = "0.1.0"
description = "Day-ahead quantile forecasts of Moldova's electricity load and the Romanian day-ahead price"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.1", "pandas>=2.2", "lightgbm>=4.5", "holidays>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sarcina = "sarcina.cli:main"

[tool.setuptools.packages.find]
include = ["sarcina*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
